<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)" />
  <g fill="#ffffff">
    <!-- Top Left Finder Pattern -->
    <rect x="96" y="96" width="128" height="128" rx="24" fill="none" stroke="#ffffff" stroke-width="28" />
    <rect x="136" y="136" width="48" height="48" rx="12" fill="#ffffff" />
    
    <!-- Top Right Finder Pattern -->
    <rect x="288" y="96" width="128" height="128" rx="24" fill="none" stroke="#ffffff" stroke-width="28" />
    <rect x="328" y="136" width="48" height="48" rx="12" fill="#ffffff" />
    
    <!-- Bottom Left Finder Pattern -->
    <rect x="96" y="288" width="128" height="128" rx="24" fill="none" stroke="#ffffff" stroke-width="28" />
    <rect x="136" y="328" width="48" height="48" rx="12" fill="#ffffff" />
    
    <!-- Data dots -->
    <rect x="256" y="256" width="32" height="32" rx="8" />
    <rect x="320" y="256" width="32" height="32" rx="8" />
    <rect x="256" y="320" width="32" height="32" rx="8" />
    <rect x="384" y="288" width="32" height="64" rx="8" />
    <rect x="288" y="384" width="64" height="32" rx="8" />
    <rect x="384" y="384" width="32" height="32" rx="8" />
  </g>
</svg>

